<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foldy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="cf-header">
      <div class="cf-brand">
        <svg class="cf-logo-svg" viewBox="0 0 1024 1024" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cfPopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5B6EF7" />
              <stop offset="50%" stop-color="#3B82F6" />
              <stop offset="100%" stop-color="#1DA1F2" />
            </linearGradient>
          </defs>
          <path d="M280 120 L590 120 L844 374 L844 630 A170 170 0 0 1 674 800 L455 800 L295 940 L295 800 L280 800 A170 170 0 0 1 110 630 L110 290 A170 170 0 0 1 280 120 Z" fill="url(#cfPopGrad)"/>
          <path d="M590 120 L844 374 L690 374 A100 100 0 0 1 590 274 Z" fill="#132238"/>
          <rect x="275" y="405" width="315" height="62" rx="31" fill="#FFFFFF"/>
          <rect x="275" y="535" width="415" height="62" rx="31" fill="#CBE7FB"/>
        </svg>
        <div>
          <div class="cf-title">Fold<span class="cf-title-fold">y</span></div>
          <div class="cf-subtitle" id="cf-sync-badge">
            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
            <span id="cf-sync-text">Cloud Sync Activo</span>
          </div>
        </div>
      </div>
      <div class="cf-header-right">
        <button id="cf-lang-btn" class="cf-lang-btn" title="Cambiar idioma (Español / English)">
          <svg viewBox="0 0 24 24" width="11.5" height="11.5" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
          <span id="cf-lang-label">ES</span>
        </button>
        <span id="cf-version" class="cf-version">v3.5.6</span>
      </div>
    </header>

    <section class="cf-section">
      <div class="cf-section-title" id="cf-platforms-title">Plataformas IA Soportadas</div>
      <div class="cf-platforms" id="cf-platforms-list"></div>
    </section>

    <section class="cf-section" id="cf-active-actions">
      <div class="cf-section-title" id="cf-actions-title">Acciones en Pestaña Activa</div>
      <div class="cf-actions-row">
        <button id="cf-btn-toggle" class="cf-btn">
          <svg viewBox="0 0 24 24" width="13.5" height="13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
          <span id="cf-lbl-toggle">Panel</span>
        </button>
        <button id="cf-btn-prompts" class="cf-btn cf-btn-primary">
          <svg viewBox="0 0 24 24" width="13.5" height="13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
          <span id="cf-lbl-prompts">Prompts</span>
        </button>
        <button id="cf-btn-backup" class="cf-btn">
          <svg viewBox="0 0 24 24" width="13.5" height="13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span id="cf-lbl-backup">Guardar</span>
        </button>
        <button id="cf-btn-import" class="cf-btn">
          <svg viewBox="0 0 24 24" width="13.5" height="13.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
          <span id="cf-lbl-import">Importar</span>
        </button>
      </div>
      <div id="cf-inactive-hint" class="cf-inactive-hint" style="display: none;">
        Abre una pestaña de Gemini, ChatGPT, Claude, DeepSeek u OpenCode para usar estas acciones.
      </div>
    </section>

    <footer class="cf-footer">
      <span id="cf-footer-text">Atajos: <kbd>Alt+Shift+F</kbd> Panel · <kbd>Alt+Shift+S</kbd> Buscar</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
